# Tweed for lazygit, part of cosmic-tweed-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/tweed.yml and
# zsh/tweed.zsh sets LG_CONFIG_FILE to "config.yml,tweed.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/tweed.yml"
gui:
  theme:
    activeBorderColor:
      - "#BDA07F"
      - bold
    inactiveBorderColor:
      - "#6B6B6E"
    searchingActiveBorderColor:
      - "#F28B7C"
      - bold
    optionsTextColor:
      - "#A8B49D"
    selectedLineBgColor:
      - "#363840"
    inactiveViewSelectedLineBgColor:
      - "#30323A"
    cherryPickedCommitFgColor:
      - "#292B31"
    cherryPickedCommitBgColor:
      - "#F3E9BD"
    markedBaseCommitFgColor:
      - "#292B31"
    markedBaseCommitBgColor:
      - "#919E85"
    unstagedChangesColor:
      - "#E77D6C"
    defaultFgColor:
      - "#D6D1C9"
  authorColors:
    "*": "#F3E9BD"
