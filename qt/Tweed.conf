# Tweed colour scheme for qt5ct / qt6ct, part of cosmic-tweed-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Tweed, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#d6d1c9, #30323a, #6b6b6e, #40434c, #151619, #363840, #d6d1c9, #f3efe8, #d6d1c9, #151619, #292b31, #151619, #bda07f, #292b31, #bda07f, #f28b7c, #30323a, #292b31, #30323a, #d6d1c9, #9f9a91
disabled_colors=#6b6b6e, #30323a, #6b6b6e, #40434c, #151619, #363840, #6b6b6e, #a8b49d, #6b6b6e, #292b31, #292b31, #151619, #6b6b6e, #a8b49d, #9f9a91, #9f9a91, #30323a, #292b31, #30323a, #d6d1c9, #6b6b6e
inactive_colors=#d6d1c9, #30323a, #6b6b6e, #40434c, #151619, #363840, #d6d1c9, #f3efe8, #d6d1c9, #151619, #292b31, #151619, #bda07f, #292b31, #bda07f, #f28b7c, #30323a, #292b31, #30323a, #d6d1c9, #9f9a91
